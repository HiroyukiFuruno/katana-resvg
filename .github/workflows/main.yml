name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: Enable this when more of the Linebender CI has been applied.
      #- name: install stable toolchain
      #  uses: dtolnay/rust-toolchain@master
      #  with:
      #    toolchain: ${{ env.RUST_STABLE_VER }}
      #    components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: install ripgrep
        run: |
          sudo apt update
          sudo apt install ripgrep

      - name: check copyright headers
        run: bash .github/copyright.sh

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # We have to use the Release mode, otherwise it would take forever.
    - name: Test
      run: cargo test --all --release

    - name: Build C API
      working-directory: crates/c-api
      run: cargo build

    - name: Build C API without default features
      working-directory: crates/c-api
      run: cargo build --no-default-features

    - name: Build resvg without default support
      working-directory: crates/resvg
      run: cargo check --no-default-features

    - name: Build usvg without default support
      working-directory: crates/usvg
      run: cargo check --no-default-features

  msrv:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Build
        run: cargo build

  # We have some Windows specific code that we should check on each commit.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Toolchain is stable-x86_64-pc-windows-msvc by default. No need to change it.

      - name: Build thumbnailer
        working-directory: tools/explorer-thumbnailer
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static # make sure it's static
        run: cargo build

      # Unlike other binaries, viewsvg isn't built with crt-static
      - name: Build C API
        working-directory: crates/c-api
        run: cargo build --release

  cross-platform-release-contract:
    name: release contract (${{ matrix.name }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: windows-x64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --all --release --locked

      - name: Build C API
        working-directory: crates/c-api
        run: cargo build --release --locked

      - name: Build C API without default features
        working-directory: crates/c-api
        run: cargo build --release --locked --no-default-features

      - name: Check resvg without default support
        working-directory: crates/resvg
        run: cargo check --locked --no-default-features

      - name: Check usvg without default support
        working-directory: crates/usvg
        run: cargo check --locked --no-default-features

  # If this fails, consider changing your text or adding something to .typos.toml.
  typos:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check typos
        uses: crate-ci/typos@v1.28.4
